<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Contact</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Sunshine Hughes business page contact form">
	<meta name="author" content="Sunshine Hughes">
	<meta name="keywords" content="Sunshine, Hughes, business, portfolio, contact">
	<link rel="stylesheet" href="style.css" media="screen">
	<link rel="icon" type="favicon" href="favicon.ico">
</head>

<body class="contact-form">
	<header>
		<h1>Contact Form</h1>
	</header>

		<nav>
			<a href="index.html#about">About</a>
			<a href="index.html#services">Services</a>
			<a href="contact.html#contact-form">Contact</a>
		</nav>

		<div class="contact">

			<h2 id="contact-form">Contact</h2>
			<form action="mailto:" method="post" enctype="text/plain">
				<label for="fname">First name:</label>
				<input type="text" id="fname" value="">
				<label for="lname">Last name:</label>
				<input type="text" id="lname" value="">
				<label for="phone">Phone</label>
				<input type="text" id="phone" value="">
				<label for="email">Email:</label>
				<input type="text" id="email" value="">
				<label for="message">Message:</label>
				<textarea id="message" rows="10" cols="30"></textarea>
				<input type="submit" value="Submit">

			</form>

		</div>

</body>
</html>
